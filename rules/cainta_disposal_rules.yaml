  - class: organic_food_waste
    local_names: [bulok, "nabubulok"]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 100
    contamination_sensitivity: low
    epr_covered: false
    pathway: home_compost
    fallback_pathway: barangay_mrf
    price_php_per_kg: {low: 0, high: 0, confidence: medium, as_of: "2026"}
