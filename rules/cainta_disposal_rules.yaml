  - id: ord-2022-010
    citation: "Cainta Municipal Ordinance No. 2022-010"
    title: "Segregation at source"
    role: "Household segregation duty; basis for the 'segregate' instruction."
    verification: unverified
    retrieved_on: null
    local_path: null
  - id: ord-2016-013
    citation: "Cainta Municipal Ordinance No. 2016-013"
    title: "Segregation at source (earlier instrument)"
    role: "Predecessor; check whether 2022-010 amends or repeals it."
    verification: unverified
    retrieved_on: null
    local_path: null
  - id: ord-2022-002
    citation: "Cainta Municipal Ordinance No. 2022-002"
    title: "Anti-littering"
    role: "Penalty basis for the leakage-path narrative."
    verification: unverified
