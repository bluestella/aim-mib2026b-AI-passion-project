# Cainta disposal rules — the Stage-2 decision layer.
#
# Plan §5.2 is explicit: given material_class plus local rules, disposal_pathway
# is largely deterministic. It is implemented here as a rules table, not as a
# second classifier, because dressing a lookup table up as machine learning is
# something a panel will catch and an LGU partner will not forgive.
#
# READ THIS BEFORE USING ANY VALUE BELOW.
# Every legal citation carries a `verification` field and every price carries an
# `as_of` and a `confidence`. Values marked `unverified` are placeholders taken
# from the planning document — they are what we expect to find, not what we have
# confirmed. Phase 1 replaces them with values read out of the harvested PDFs
# (scrapers/cainta_ordinances.py); Phase 2 replaces the prices with field-survey
# observations. Nothing marked `unverified` may be shown to a user as official
# LGU policy or as a price a junkshop will actually pay (plan §7.8).

meta:
  schema_version: 1
  status: provisional
  updated_on: 2026-07-26
  municipality: Cainta
  province: Rizal
  psgc_code: "0405805000"
  blocking_gate: >-
    Phase 1 is not complete until every legal_source below has
    verification: harvested and a retrieved_on date.

# --- Legal basis --------------------------------------------------------------
# Populated by the ordinance harvester. `verification: unverified` means the
# citation comes from the planning document and the PDF has not yet been read.
