  - class: paper_newsprint
    local_names: [dyaryo, "puting papel"]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 5
    contamination_sensitivity: high
    epr_covered: false
    pathway: sell_junkshop
    fallback_pathway: barangay_mrf
    price_php_per_kg: {low: 4, high: 8, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
