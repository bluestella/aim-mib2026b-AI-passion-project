  - class: glass_bottle
    local_names: ["bote (salamin)", salamin]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 300
    contamination_sensitivity: medium
    epr_covered: false
    pathway: barangay_mrf
    fallback_pathway: residual_to_slf
    price_php_per_kg: {low: 0, high: 2, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    # A nominal price exists but most shops will not take it. Showing the range
    # without this flag sends someone across the barangay with a heavy sack for a
    # refusal — the exact wasted trip this app is supposed to prevent.
    often_refused: true
    prep_en: "Often refused by junkshops — heavy, low value, and a breakage risk. Refillable soft-drink and beer bottles are the exception: return those to the store for the deposit."
    prep_tl: "Madalas tinatanggihan ng junkshop — mabigat, mababa ang halaga, at delikadong mabasag. Iba ang bote ng softdrinks at beer na may balik-bote — isauli sa tindahan."
    citations: [ord-2022-010]

  - class: cardboard
