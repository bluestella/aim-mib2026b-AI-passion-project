# --- Pathways -----------------------------------------------------------------
pathways:
  sell_junkshop:
    label_en: "Sell to a junkshop"
    label_tl: "Ibenta sa junkshop"
    terminus: recovery
  barangay_mrf:
    label_en: "Bring to the barangay MRF"
    label_tl: "Dalhin sa MRF ng barangay"
    terminus: recovery
  home_compost:
    label_en: "Compost at home"
    label_tl: "I-compost sa bahay"
    terminus: recovery
  special_waste_dropoff:
    label_en: "Special waste drop-off"
    label_tl: "Espesyal na basura — may hiwalay na drop-off"
    terminus: controlled
  residual_to_slf:
    label_en: "Residual — collected for the sanitary landfill"
    label_tl: "Residual — kokolektahin para sa sanitary landfill"
    terminus: disposal

# --- Price provenance ---------------------------------------------------------
# One place to state what the price ranges below are and are not.
price_provenance:
  source: "Planning document §5.1, indicative 2026 ranges."
  confidence: low
  verified_shops: 0
  note: >-
    These are indicative ranges, not observed Cainta counter prices. The UI must
    show last_verified_date alongside any price and visibly decay confidence as
    it ages (plan §10). Until verified_shops >= 25, present ranges as
    "typical range" and never as "what this shop pays".

# --- Materials ----------------------------------------------------------------
# `class` values are the 10-class taxonomy from plan §5.1, mapped to junkshop
# trade names rather than academic categories.
materials:
  - class: PET_bottle
    local_names: [bote, plastik, "PET"]
    resin_code: 1
    is_laminated_multilayer: false
    typical_unit_mass_g: 25
    contamination_sensitivity: medium
    epr_covered: true
    pathway: sell_junkshop
    fallback_pathway: barangay_mrf
    price_php_per_kg: {low: 10, high: 14, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    prep_en: "Empty it, rinse it, and crush it flat. Caps and labels can stay on for most buyers — confirm with the shop."
    prep_tl: "Ubusin, banlawan, at ipisa. Karaniwang tinatanggap pati takip at label — itanong sa junkshop."
    citations: [ord-2022-010, ra-11898]

  - class: HDPE_PP_rigid
    local_names: [sibak, "HDPE", "PP"]
    resin_code: 2
    is_laminated_multilayer: false
    typical_unit_mass_g: 40
    contamination_sensitivity: medium
    epr_covered: true
    pathway: sell_junkshop
    fallback_pathway: barangay_mrf
    price_php_per_kg: {low: 15, high: 15, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    prep_en: "Rinse out food or detergent residue. Shampoo bottles, pails, and basins count."
    prep_tl: "Banlawan ang natirang laman. Kasama rito ang bote ng shampoo, timba, at planggana."
    citations: [ord-2022-010, ra-11898]

  - class: plastic_film_sachet
    local_names: [sachet, laminated, "plastik na manipis"]
    resin_code: 7
    is_laminated_multilayer: true
    typical_unit_mass_g: 3
    contamination_sensitivity: high
    epr_covered: true
    pathway: residual_to_slf
    fallback_pathway: null
    price_php_per_kg: {low: 0, high: 0, confidence: medium, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: 0
    prep_en: "No junkshop buys this. Keep it dry and out of the drain — this is the material that clogs Cainta's creeks. Check whether a nearby EPR take-back or ecobrick programme accepts it."
    prep_tl: "Walang junkshop na bumibili nito. Panatilihing tuyo at huwag itapon sa kanal — ito ang bumabara sa mga sapa ng Cainta. Tingnan kung may EPR take-back o ecobrick program malapit sa inyo."
    citations: [ord-2023-012, ra-11898]
    # See plan §5.1 and §10. This class has no market, is the dominant residual
    # in Philippine household waste, is the primary creek-clogging material, and
    # is barely present in TACO or TrashNet. Report its recall separately from
    # headline accuracy, always.
    is_critical_class: true

  - class: aluminium_can
    local_names: [lata, aluminum, "aluminium"]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 15
    contamination_sensitivity: low
    epr_covered: false
    pathway: sell_junkshop
    fallback_pathway: barangay_mrf
    price_php_per_kg: {low: 50, high: 70, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    prep_en: "Rinse and flatten. The highest-value everyday item in most households."
    prep_tl: "Banlawan at ipisa. Ito ang pinakamahal sa karaniwang basura sa bahay."
    citations: [ord-2022-010]

  - class: ferrous_metal
    local_names: [bakal, yero]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 200
    contamination_sensitivity: low
    epr_covered: false
    pathway: sell_junkshop
    fallback_pathway: null
    price_php_per_kg: {low: 11, high: 14, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    prep_en: "Sold by weight. Many shops set a minimum weight — worth checking before you carry it over."
    prep_tl: "Timbang ang basehan. Marami ang may minimum na timbang — itanong muna bago dalhin."
    citations: [ord-2022-010]

  - class: copper_wire
    local_names: [tanso]
    resin_code: null
    is_laminated_multilayer: false
    typical_unit_mass_g: 50
    contamination_sensitivity: low
    epr_covered: false
    pathway: sell_junkshop
    fallback_pathway: null
    price_php_per_kg: {low: 350, high: 400, confidence: low, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: null
    prep_en: "The highest-value common scrap. Stripped wire is worth more than insulated."
    prep_tl: "Pinakamataas ang halaga. Mas mahal ang hinubaran ng insulation."
