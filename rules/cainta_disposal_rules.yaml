    prep_en: "Compost it or set it out on the biodegradable collection day. RA 9003 treats this as a diverted stream, not residual — it is usually the largest share of household waste by weight."
    prep_tl: "I-compost o ilabas sa araw ng nabubulok. Sa ilalim ng RA 9003, hindi ito residual — kadalasan ito ang pinakamabigat na bahagi ng basura sa bahay."
    citations: [ra-9003, ord-2022-010]

  - class: residual_other
    local_names: [residual, "iba pa"]
    resin_code: null
    is_laminated_multilayer: null
    typical_unit_mass_g: null
    contamination_sensitivity: null
    epr_covered: false
    pathway: residual_to_slf
    fallback_pathway: null
    price_php_per_kg: {low: 0, high: 0, confidence: medium, as_of: "2026"}
    accepted_by_pct_of_local_junkshops: 0
    prep_en: "Catch-all for anything the classifier cannot place. Set out on residual collection day."
    prep_tl: "Para sa hindi matukoy. Ilabas sa araw ng residual."
    citations: [ord-2023-012]

# --- Overrides ----------------------------------------------------------------
# Applied after the material lookup. These are hazard and special-waste routes
# that cut across material classes, so they cannot live on a single class row.
#
# `reason_*` explains why the pathway changed. `prep_*` REPLACES the material's own
# prep text, because once an override fires the material's instructions are usually
# wrong: telling someone to rinse and sell a PET bottle contradicts a verdict that
# just routed it to residual.
overrides:
  - id: special-waste-battery
    when: {user_flag: battery}
    pathway: special_waste_dropoff
    reason_en: "Batteries are special waste under RA 9003 and must not enter household residual."
    reason_tl: "Espesyal na basura ang baterya sa ilalim ng RA 9003 — hindi ito dapat ihalo sa residual."
    prep_en: "Keep it dry and separate, ideally taped at the terminals. Do not bin it and do not burn it. Ask the barangay when the next special waste collection is."
    prep_tl: "Itabi nang tuyo at hiwalay, mabuti kung natakpan ang dulo. Huwag ihalo sa basura at huwag sunugin. Itanong sa barangay kung kailan ang susunod na special waste collection."
    citations: [ra-9003, ord-2023-012]
  - id: special-waste-ewaste
    when: {user_flag: electronic}
    pathway: special_waste_dropoff
    reason_en: "Electronics need a WEEE-accredited handler. Some junkshops buy them for the copper — that is not safe handling."
    reason_tl: "Kailangan ng akreditadong tagakuha ang electronics. May junkshop na bumibili para sa tanso — hindi iyon ligtas na pagtatapon."
    prep_en: "Keep it whole — do not strip it for the copper, which is where the hazard is. Look for an accredited e-waste handler or a barangay collection drive."
    prep_tl: "Huwag hatiin o kunan ng tanso — doon ang panganib. Hanapin ang akreditadong e-waste handler o ang collection drive ng barangay."
    citations: [ra-9003, ord-2023-012]
  - id: contaminated-recyclable
    when: {contaminated: true}
    pathway: residual_to_slf
    reason_en: "Food-contaminated paper and cardboard are refused at the counter and downgrade a whole bale."
    reason_tl: "Tinatanggihan ang papel at kartong may dumi ng pagkain — nasisira nito ang buong bale."
    prep_en: "If you can still rinse and dry it, it goes back to its normal route and keeps its value. If the soiling cannot be removed, it is residual — separating it protects the rest of the bale."
    prep_tl: "Kung kaya pang banlawan at patuyuin, bumalik ito sa dating ruta at may halaga pa rin. Kung hindi na maaalis ang dumi, residual na ito — ang paghihiwalay dito ang nagliligtas sa iba pang naipon."
    citations: [ord-2022-010]
